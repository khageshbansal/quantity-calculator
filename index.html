<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Estimate / Bill</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#172033;font-family:Inter,"Segoe UI",Arial,sans-serif}
.app{max-width:1000px;margin:28px auto;padding:0 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.toolbar h1{margin:0;font-size:22px}.toolbar p{margin:5px 0;color:#64748b;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #d5dce5;background:white;border-radius:8px;padding:9px 13px;font-weight:600;color:#243047}button:hover{background:#f1f5f9}.primary{background:#2563eb;border-color:#2563eb;color:white}.primary:hover{background:#1d4ed8}
.sheet{background:white;box-shadow:0 10px 40px #14213d12;border:1px solid #dfe5ec;border-radius:12px;padding:32px 36px}
.billhead{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:22px;border-bottom:2px solid #172033;gap:20px}.brand h2{margin:0;font-size:28px;letter-spacing:-.5px}.brand p{margin:6px 0 0;color:#64748b;font-size:13px}.billtitle{text-align:right}.billtitle h3{margin:0;font-size:23px;text-transform:uppercase;letter-spacing:2px}.billtitle label{display:block;color:#64748b;font-size:13px;margin-top:6px}
.meta{display:flex;justify-content:space-between;gap:20px;padding:18px 0 20px}.meta label,.notes label{display:block;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}.meta input{font:inherit;border:0;border-bottom:1px solid #d9e0e8;padding:6px 2px;width:220px;outline:none}.meta .date input{width:150px}
table{width:100%;border-collapse:collapse;table-layout:fixed}thead th{background:#172033;color:white;text-align:left;padding:11px 12px;font-size:12px;letter-spacing:.5px;text-transform:uppercase}thead th:nth-child(1){width:52%}thead th:nth-child(2){width:15%}thead th:nth-child(3){width:17%}thead th:nth-child(4){width:16%;text-align:right}
tbody td{border-bottom:1px solid #e6ebf0;padding:8px 8px}tbody tr:nth-child(even){background:#fafbfd}td input{width:100%;padding:9px 8px;border:1px solid transparent;background:transparent;border-radius:5px;font:inherit;outline:none}td input:focus{background:#fff;border-color:#93b4f7;box-shadow:0 0 0 2px #2563eb12}td.qty input,td.rate input{text-align:right}td.amount{text-align:right;padding-right:13px;font-weight:650;white-space:nowrap}.remove{color:#9aa5b5;border:0;background:transparent;padding:4px;font-size:18px}.remove:hover{color:#dc2626;background:transparent}.addrow{padding:12px 0}
.lower{display:flex;justify-content:space-between;gap:30px;margin-top:20px}.notes{flex:1;max-width:440px}.notes textarea{width:100%;min-height:90px;border:1px solid #e0e6ed;border-radius:8px;padding:10px;font:inherit;resize:vertical;outline:none}.summary{width:310px;display:flex;flex-direction:column;gap:12px}.sumrow{display:flex;justify-content:space-between;align-items:center;font-size:14px}.sumrow input{width:100px;text-align:right;padding:7px;border:1px solid #dce3eb;border-radius:7px;font:inherit}.sumrow .discount-controls{display:flex;gap:5px;align-items:center}.sumrow select{padding:7px;border:1px solid #dce3eb;border-radius:7px;background:white}.grand{border-top:2px solid #172033;padding-top:14px;font-size:20px;font-weight:800}.foot{margin-top:26px;padding-top:13px;border-top:1px solid #e5eaf0;color:#94a3b8;font-size:11px;text-align:center}
@media(max-width:700px){.sheet{padding:20px 14px}.toolbar{align-items:flex-start;flex-direction:column}.billhead{flex-direction:column}.billtitle{text-align:left}.meta{flex-direction:column}.meta input{width:min(100%,300px)}.lower{flex-direction:column}.summary{width:100%;max-width:none}.notes{max-width:none}table{min-width:540px}.tablewrap{overflow-x:auto}}
@media print{body{background:white}.app{margin:0;padding:0;max-width:none}.toolbar,.addrow,.remove,.foot,.actions,.no-print{display:none!important}.sheet{box-shadow:none;border:0;border-radius:0;padding:10px 12px}.billhead{padding-bottom:15px}td input{border:0!important;background:transparent!important;box-shadow:none!important;padding:5px 4px}td{padding:5px 4px}thead th{background:#172033!important;color:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.notes textarea{border:0;resize:none;padding:0}.meta input{border-bottom:1px solid #ccc}.lower{margin-top:15px}}
</style></head>
<body><div class="app">
<div class="toolbar"><div><h1>Quick Bill & Quantity Calculator</h1><p>Auto totals · Print-ready bill</p></div><div class="actions"><button onclick="clearBill()">Clear bill</button><button onclick="addRow()">＋ Add row</button><button class="primary" onclick="window.print()">Print / PDF</button></div></div>
<div class="sheet">
<div class="billhead"><div class="brand"><h2 contenteditable="true">Enter Your Business Name</h2><p contenteditable="true">Business address · Phone · Details</p></div><div class="billtitle"><h3>Bill / Estimate</h3><label>Bill No. <input id="billno" placeholder="0001" style="border:0;border-bottom:1px solid #ddd;width:100px;text-align:right;padding:5px"></label></div></div>
<div class="meta"><div><label>Bill to</label><input placeholder="Customer / party name"></div><div class="date"><label>Date</label><input type="date" id="date"></div></div>
<div class="tablewrap"><table><thead><tr><th>Particulars</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th><th class="no-print" style="width:36px"></th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="addrow"><button onclick="addRow()">＋ Add item</button></div>
<div class="lower"><div class="notes"><label>Notes / Terms</label><textarea placeholder="Thank you! Add any notes or terms here..."></textarea></div><div class="summary"><div class="sumrow"><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div><div class="sumrow"><span>Discount</span><span class="discount-controls"><input id="discount" type="number" min="0" value="0" oninput="calc()"><select id="dtype" onchange="calc()"><option value="percent">%</option><option value="amount">₹</option></select></span></div><div class="sumrow"><span>Discount amount</span><strong id="discountAmt">₹0.00</strong></div><div class="sumrow grand"><span>Grand Total</span><span id="grand">₹0.00</span></div></div></div>
<div class="foot">Created by Khagesh · Thank you for your business</div>
</div></div>
<script>
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(n)||0);
function addRow(desc='',qty='',rate=''){
 const tr=document.createElement('tr');tr.innerHTML=`<td><input class="desc" placeholder="Item / description" value="${esc(desc)}"></td><td class="qty"><input class="qtyval" type="number" min="0" step="any" placeholder="0" value="${qty}" oninput="calc()"></td><td class="rate"><input class="rateval" type="number" min="0" step="any" placeholder="0.00" value="${rate}" oninput="calc()"></td><td class="amount">₹0.00</td><td class="no-print"><button class="remove" title="Remove row" onclick="removeRow(this)">×</button></td>`;
 document.getElementById('tbody').appendChild(tr);calc();return tr;
}
function removeRow(btn){let tr=btn.closest('tr');let next=tr.nextElementSibling,prev=tr.previousElementSibling;tr.remove();calc();(next||prev)?.querySelector('.desc')?.focus()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function calc(){let subtotal=0;document.querySelectorAll('#tbody tr').forEach(tr=>{let q=Number(tr.querySelector('.qtyval').value)||0,r=Number(tr.querySelector('.rateval').value)||0,a=q*r;subtotal+=a;tr.querySelector('.amount').textContent=money(a)});let d=Number(document.getElementById('discount').value)||0,disc=document.getElementById('dtype').value==='percent'?subtotal*d/100:d;disc=Math.min(Math.max(0,disc),subtotal);document.getElementById('subtotal').textContent=money(subtotal);document.getElementById('discountAmt').textContent=money(disc);document.getElementById('grand').textContent=money(subtotal-disc)}
// Enter advances through description, quantity, rate, then creates a row; Shift+Enter moves backward.
document.getElementById('tbody').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;e.preventDefault();let inputs=[...document.querySelectorAll('#tbody input.desc,#tbody input.qtyval,#tbody input.rateval')],idx=inputs.indexOf(e.target);if(e.shiftKey){if(idx>0)inputs[idx-1].focus();return;}if(idx>=0&&idx<inputs.length-1)inputs[idx+1].focus();else{let tr=addRow();tr.querySelector('.desc').focus()}});
function clearBill(){if(confirm('Clear all bill details and reset?')){document.getElementById('tbody').innerHTML='';document.getElementById('discount').value=0;document.getElementById('dtype').value='percent';document.querySelector('.meta input:not([type=date])').value='';document.querySelector('.notes textarea').value='';document.getElementById('billno').value='';addRow();document.querySelector('#tbody .desc').focus();}}
document.getElementById('date').value=new Date().toISOString().slice(0,10);addRow();addRow();document.querySelector('#tbody .desc').focus();
</script></body></html>
